# Config file for numad
#
# Default INTERVAL is 15
# modify below to change it
INTERVAL=15

# NUMAD_ARGS takes precedence over INTERVAL when present.
NUMAD_ARGS="-i 5:15 \
  --gpu-aware=1 \
  --gpu-backend=auto \
  --gpu-min-busy=10 \
  --gpu-min-vram=256 \
  --gpu-fdinfo-discovery=15 \
  --gpu-migrate=auto \
  --gpu-migrate-busy-max=20 \
  --scx-mode=cooperate \
  --bind-cooldown=300 \
  -S 1"
